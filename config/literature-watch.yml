# Settings of the literature watch (.github/workflows/runner-literature-watch.yml
# and the R scripts in R/), the researcher of this hub. Design:
# dev-notes/hub-design.md.

# What every field's search has around its own part: the study design and
# the filters (open-access full text in PMC, no reviews or meta-analyses),
# so no field can forget them. Changing either gives every field a new
# search version (queries.csv) and a fresh sample.
search:
  design: '"Epidemiologic Studies"[MeSH Terms]'
  filters: '"pubmed pmc open access"[filter] NOT (review[pt] OR systematic review[pt] OR meta-analysis[pt])'

# How much is read, and how fast. A round is complete when every field has
# target_per_month papers (or all, if a month has fewer) of every
# publication month of the last years_back years read; you then get a pull
# request saying so, and the nightly runs only read each new month. Raise
# target_per_month and/or years_back for the next round: it reads only the
# papers not yet read. papers_per_run is the pace (about 2,000 papers fit
# into a 5-hour session on Max 5x); a run started by hand can set another
# number once (max-papers).
sampling:
  target_per_month: 25
  # 10 years for the first backfill (user, 2026-11-18), an exception to the
  # default of 5. Once the round is complete, the same nightly run only
  # reads each month that becomes due.
  years_back: 10
  # The current month is read too (user, 2026-11-25): papers that reach PMC
  # later are picked up by the nightly re-search of the newest months.
  lag_months: 0           # the newest month is this many months back
  recheck_months: 6       # the newest months are searched again on each run's day
  papers_per_run: 1500    # at most this many papers per run (the manual input max-papers overrides it once)

# Reading: papers per Claude call, and how much of a methods section (its
# statistics subsections first).
reading:
  batch: 5
  max_section_chars: 12000

# Where things go in the hub: the data on its own branch (the workflow's
# input data-branch, pushed by the runs without a pull request:
# papers/YYYY/YYYY-MM.jsonl, months.csv, queries.csv and readers.csv under
# `data`), and the report (overview.md, progress.csv) under `reports` on
# the same branch, written at the end of every run.
files:
  data: literature-watch/data
  reports: literature-watch/reports

# The vocabulary (R/vocabulary_literature.R, the job after the reading):
# Claude (Opus) sorts the method names the papers gave into methods and
# variants (vocabulary.yml under `data`, written by the workflow, never by
# hand); only names not classified yet are asked about.
vocabulary:
  batch: 60            # names per call
  max_calls: 15        # calls per run for names and variants together

# "Exists in DataSHIELD?" (R/candidates_literature.R, when candidates are
# due): down the ranking of the most used methods and variants, each is
# checked against the functions of the DataSHIELD packages, from the
# catalogue's inventory (FederatedMethods/packages' packages.json, which
# also gives each package's status; retired ones are left out), until each list has its
# gaps (`candidates$most_used`, `candidates$rising`). R picks the `candidates` functions sharing most words
# with the method, Claude answers with the function and a quote from its
# title or description, which R checks. Asked again only when those
# candidates change. Not every night and not for every method: only where
# a candidate could come from.
exists:
  candidates: 15
  batch: 5             # methods per call
  max_calls: 15
  architectures: [client, other]   # client functions and exported helpers, not server functions
  # The catalogue's packages.json (since 2026-11-18: packages with their
  # status and their functions' roxygen); packages_url is only read for
  # the older format (a table of functions).
  functions_url: https://packages.datashield.org/packages.json
  packages_url: https://raw.githubusercontent.com/FederatedMethods/packages/main/package_list.csv

# The candidates (runner-candidate-selection.yml: monthly and by hand,
# apart from the reading; user, 2026-11-20): two lists of methods (and
# variants) DataSHIELD lacks (`none` or `partial`; `development` doesn't
# count), ranked over all papers read so far: the `most_used` ones by share
# over all years read, and the `rising` ones (a rising trend, p < 0.05,
# ordered by their share in the last `report$share_years` years), without
# the first list's candidates and their variants (user, 2026-11-18). They
# are researched by Claude (with web search) and proposed to the hub as a
# pull request, three boxes per candidate: open an issue, not now, don't
# suggest again. Methods with a hub issue (open or closed) are left out; a
# "don't suggest again" comes back when its papers reach `resuggest_factor`
# times the count at the decision. The decisions are kept in
# decisions.json under `data`. A brief is reused for
# `research_max_age_days` while the "Exists?" verdict and the catalogue
# functions found stay the same; after that Claude updates it (research.json
# under `data`).
candidates:
  most_used: 7          # candidates by share over all years
  rising: 3             # candidates on the rise
  min_papers: 5         # over all years read
  branch_prefix: bot-suggest/literature-watch/candidates
  folder: literature-watch/candidates    # on the hub's main branch, one file per month
  resuggest_factor: 2
  examples: 3           # example papers per candidate
  research_max_age_days: 183   # a brief is reused this long (six months)

# The report.
report:
  top: 20                 # methods listed per section
  min_variant_papers: 2   # a variant is listed once this many papers name it
  share_years: 3          # methods are ranked by their share over the last years
  chart_methods: 5        # trend charts for the top methods

ncbi:
  base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
  tool: datashield-function-ideas   # the tool name NCBI asks for; no e-mail is sent
  rate_per_second: 3           # without an API key (NCBI_API_KEY: 10)

# The fields watched: each name and its part of the PubMed search. Every
# field's search is
#   "Epidemiologic Studies"[MeSH Terms] AND (<pubmed>) AND
#   "pubmed pmc open access"[filter] NOT (review[pt] OR systematic review[pt] OR meta-analysis[pt])
# (design and filters from `search` above). MeSH headings
# include everything below them in the MeSH tree; [majr] means the paper's
# main subject. Checked on the PubMed website on 2026-11-16 (open-access
# research articles 2022-2026 in brackets). Changing a field's search gives
# it a new version (data branch: queries.csv) and a fresh sample; a new
# field gets its own backfill, papers already read aren't read again.
fields:
  - name: cardiovascular             # ~50,200
    pubmed: '"Cardiovascular Diseases"[majr]'
  - name: metabolic                  # ~34,500
    pubmed: '"Nutritional and Metabolic Diseases"[majr]'
  - name: mental-health              # ~25,900
    pubmed: '"Mental Disorders"[majr]'
  - name: cancer                     # ~67,000
    pubmed: '"Neoplasms"[majr]'
  - name: respiratory-allergy        # ~19,800 (infections apart: COVID-19 would dominate)
    pubmed: '("Respiratory Tract Diseases"[majr] OR "Hypersensitivity"[majr]) NOT "Respiratory Tract Infections"[majr]'
  - name: infections                 # ~68,600 (COVID-19 dominates 2020-2023)
    pubmed: '"Infections"[majr]'
  - name: pregnancy-child            # ~13,700
    pubmed: '"Pregnancy Complications"[majr] OR "Prenatal Exposure Delayed Effects"[majr] OR "Child Development"[majr] OR "Infant, Newborn, Diseases"[majr]'
  - name: environment                # ~3,900
    pubmed: '"Environmental Exposure"[majr] OR "Environmental Pollutants"[majr] OR "Air Pollution"[majr] OR "Noise"[majr] OR "Built Environment"[majr]'
  - name: nutrition                  # ~8,000
    pubmed: '"Diet"[majr] OR "Nutritional Status"[majr] OR "Feeding Behavior"[majr]'
  - name: omics                      # ~4,300
    pubmed: '"Genomics"[majr] OR "Epigenomics"[majr] OR "Metabolomics"[majr] OR "Proteomics"[majr] OR "Multiomics"[majr] OR "Microbiota"[majr]'
  - name: lifestyle                  # ~8,600
    pubmed: '"Exercise"[majr] OR "Sedentary Behavior"[majr] OR "Smoking"[majr] OR "Alcohol Drinking"[majr] OR "Sleep"[majr]'
