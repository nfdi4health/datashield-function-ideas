# Claude settings of the hub, per task: model, tokens, thinking, tool name
# (claude_settings(): a profile is merged over `default`). Copied from
# nfdi4health/datashield-workflows' config/claude.yml on 2026-11-19 (its
# `default` and `model_rules`); keep `model_rules` current when models come
# out, here as there.

# What some models reject, for claude_settings() / adapt_to_model(): a
# profile, or a caller's `model` input, can name any model, and its
# settings are fitted to it (tool_choice auto, adaptive thinking, no
# server-side fallback, no effort). A model in no list is sent as the profile says.
# Extend the lists when new models come out.
model_rules:
  no_forced_tool_choice: [claude-opus-5-5, claude-sonnet-5-5, claude-fable-5-1, claude-mythos-5-1]
  no_disabled_thinking: [claude-opus-5-5, claude-sonnet-5-5, claude-fable-5, claude-fable-5-1, claude-mythos-5, claude-mythos-5-1]
  server_side_fallbacks: [claude-fable-5-1, claude-opus-5-5, claude-opus-5, claude-sonnet-5-5]
  no_effort: [claude-haiku-4-5, claude-sonnet-4-5]

default:
  anthropic:
    model: claude-sonnet-5
    max_tokens: 4096
    api_version: "2023-06-01"
    thinking:
      type: disabled
    tool_choice_type: tool

methods-extraction:
  anthropic:
    tool_name: submit_method_sources
    # Sonnet, not Haiku (2026-11-16, after the pilot): what counts as a
    # method or a variant is a judgement everything later builds on.
    model: claude-sonnet-5-5
    tool_choice_type: auto
    thinking:
      type: adaptive
    effort: low        # a reading task; thinking counts towards max_tokens
    max_tokens: 16000

# The literature watch's vocabulary (R/vocabulary_literature.R): which method
# names mean the same method, method or variant, few calls a night (only
# names not classified yet), so the strong model (user, 2026-11-16).
methods-classification:
  anthropic:
    tool_name: submit_method_classes
    model: claude-opus-5-5
    tool_choice_type: auto
    thinking:
      type: adaptive
    effort: medium
    max_tokens: 32000

# The same for variant wordings: per method, which wordings are the same
# variant, and which are a method of their own.
methods-variants:
  anthropic:
    tool_name: submit_variant_classes
    model: claude-opus-5-5
    tool_choice_type: auto
    thinking:
      type: adaptive
    effort: medium
    max_tokens: 32000

# The literature watch's "Exists in DataSHIELD?" (R/candidates_literature.R, down the ranking):
# a method and its variant against the candidate functions' documentation,
# with the line that shows it (R checks it).
methods-exists:
  anthropic:
    tool_name: submit_exists_verdicts
    model: claude-opus-5-5
    tool_choice_type: auto
    thinking:
      type: adaptive
    effort: medium
    max_tokens: 32000

# The literature watch's research step (R/candidates_literature.R): for
# each of the month's top candidates, what the method is, R packages that
# do it, federated approaches in the literature and a first disclosure
# view, with web search (user, 2026-11-17).
methods-research:
  anthropic:
    tool_name: submit_candidate_research
    model: claude-opus-5-5
    tool_choice_type: auto
    thinking:
      type: adaptive
    effort: high
    max_tokens: 32000
    web_search: 8          # at most this many searches per candidate

# The hub's "Exists?" check of new issues (R/check_ideas.R): what method an
# issue asks for, its keywords and similar hub issues, read from the
# untrusted issue text. The verdict itself is the `methods-exists` call.
idea-reading:
  anthropic:
    tool_name: submit_idea_method
    model: claude-sonnet-5-5
    tool_choice_type: auto
    thinking:
      type: adaptive
    effort: low
    max_tokens: 8000
# Which method of the literature watch a hub issue's method is, when no
# name matches exactly (match_idea_literature()); numbers only, no marker.
idea-literature:
  anthropic:
    tool_name: submit_literature_match
    model: claude-sonnet-5-5
    tool_choice_type: auto
    thinking:
      type: adaptive
    effort: low
    max_tokens: 8000
