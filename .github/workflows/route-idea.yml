name: Route Idea

# A routing label, set by a listed login, copies the idea to the
# repository config/routes.yml names for it, opened in the maintainer's
# name with ROUTE_TOKEN (a classic token with only public_repo); this
# issue stays open as the record of demand, with a link to the copy. A
# change of the routes (or a run started by hand) creates the route labels
# that don't exist yet.
on:
  issues:
    types: [labeled]
  push:
    branches: [main]
    paths: ['config/routes.yml', '.github/workflows/route-idea.yml']
  workflow_dispatch:

jobs:
  route:
    permissions:
      issues: write
    uses: nfdi4health/datashield-workflows/.github/workflows/route-idea.yml@main
    with:
      allowed-logins: FlorianSchw
    secrets:
      route-token: ${{ secrets.ROUTE_TOKEN }}
