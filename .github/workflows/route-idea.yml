name: Route Idea

# A routing label, set by a listed login, copies the idea to the topic
# package's (client) repository, opened in the maintainer's name with
# ROUTE_TOKEN (a classic token with only public_repo); this issue stays
# open as the record of demand, with a link to the copy. A push of this
# file (or a run started by hand) creates the route labels that don't
# exist yet.
on:
  issues:
    types: [labeled]
  push:
    branches: [main]
    paths: ['.github/workflows/route-idea.yml']
  workflow_dispatch:

jobs:
  route:
    permissions:
      issues: write
    uses: nfdi4health/datashield-workflows/.github/workflows/route-idea.yml@main
    with:
      allowed-logins: FlorianSchw
      # label = owner/repo, one per line: the package's name as the label,
      # its client repository as the target.
      routes: |
        dsBase = datashield/dsBaseClient
        dsSurvival = datashield/dsSurvivalClient
        dsMediation = datashield/dsMediationClient
        dsTidyverse = molgenis/ds-tidyverse-client
        dsOmics = isglobal-brge/dsOmicsClient
        dsExposome = isglobal-brge/dsExposomeClient
        dsML = isglobal-brge/dsMLClient
        dsOMOP = isglobal-brge/dsOMOPClient
        dsGamlss = bips-hb/dsGamlssClient
        dsSwissKnife = sib-swiss/dsSwissKnifeClient
        dsMTL = transbioZI/dsMTLClient
        dsClusterAnalysis = FlorianSchw/dsClusterAnalysisClient
        dsIntestinalMicrobiomics = FlorianSchw/dsIntestinalMicrobiomicsClient
        dsSupport = nfdi4health/dsSupportClient
    secrets:
      route-token: ${{ secrets.ROUTE_TOKEN }}
