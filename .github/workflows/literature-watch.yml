name: Literature Watch

# The literature watch: which statistical methods epidemiological research
# uses, from PubMed and PMC, to find what DataSHIELD lacks. It runs in the
# private runner repository (nightly, and in one queue with the
# implementer, on the maintainer's Claude subscription); this starts an
# extra run there. It reads the fields of config/literature-watch.yml,
# pushes the data to this repository's `data` branch and proposes the
# report (literature-watch/reports/overview.md) by pull request.
on:
  workflow_dispatch:
    inputs:
      field:
        description: 'One field of config/literature-watch.yml (empty: all of them)'
        default: ''
      max-papers:
        description: 'At most this many papers in this run, e.g. more over a holiday (empty: papers_per_run of config/literature-watch.yml)'
        default: ''

jobs:
  start:
    permissions:
      contents: read
    uses: nfdi4health/datashield-workflows/.github/workflows/literature-watch-start.yml@main
    with:
      runner-repository: FlorianSchw/datashield-agent-runner
      field: ${{ inputs.field }}
      max-papers: ${{ inputs.max-papers }}
      allowed-logins: FlorianSchw
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
