name: Methods Scan

# The researcher: which statistical methods health research uses, from
# PubMed and PMC, to find what DataSHIELD lacks. It runs in the private
# runner repository (one queue with the implementer, on the maintainer's
# Claude subscription); this only starts it there. It reads the queries in
# config/methods-scan.yml and proposes its report as scans/pilot-YYYY-MM.md
# by pull request.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pilot (abstract against methods section, a report only)'
        default: pilot
      query:
        description: 'Query name in config/methods-scan.yml (empty: the first)'
        default: ''

jobs:
  start:
    permissions:
      contents: read
    uses: nfdi4health/datashield-workflows/.github/workflows/methods-scan-start.yml@main
    with:
      runner-repository: FlorianSchw/datashield-agent-runner
      mode: ${{ inputs.mode }}
      query: ${{ inputs.query }}
      allowed-logins: FlorianSchw
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
