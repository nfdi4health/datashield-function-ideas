name: Methods Scan

# The researcher: which statistical methods health research uses, from
# PubMed and PMC, to find what DataSHIELD lacks. Started by hand for now;
# `pilot` compares abstracts with methods sections and writes a report
# into the run's summary. The queries are in config/methods-scan.yml.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pilot (abstract against methods section, a report only)'
        default: pilot
      query:
        description: 'Query name in config/methods-scan.yml (empty: the first)'
        default: ''

jobs:
  scan:
    permissions:
      contents: read
    uses: nfdi4health/datashield-workflows/.github/workflows/methods-scan.yml@main
    with:
      mode: ${{ inputs.mode }}
      query: ${{ inputs.query }}
      subscription-logins: FlorianSchw
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ncbi-api-key: ${{ secrets.NCBI_API_KEY }}
