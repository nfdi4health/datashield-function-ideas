name: Cleanup Branches

# Deletes a closed pull request's `bot-suggest/*` or `agent-suggest/*`
# branch of this repository (the literature watch's report branch, Claude
# Code sessions' branches) unless another open pull request still uses it.
# Other branches stay, `data` (the literature watch's data) and `main`
# among them.
on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'bot-suggest/') ||
      startsWith(github.event.pull_request.head.ref, 'agent-suggest/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete the suggestion branch
        # The branch name through the environment, never written into the
        # script itself (a crafted name could otherwise run as shell code).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "Another open PR still references $BRANCH — leaving it."
            exit 0
          fi

          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || echo "Branch already gone."
